<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ניהול עץ המשפחה</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./admin.css"><script defer src="./config.js"></script><script defer src="./admin.js"></script></head><body><header class="topbar"><div class="brand"><span class="brand-mark">✦</span>ניהול עץ המשפחה</div><a class="admin-link" href="./">חזרה לעץ</a></header><main class="admin-main"><h1>ניהול פרופילים</h1><p>שמות בעברית וברוסית, זיכרון ותמונות. השינויים יופיעו באתר לאחר שמירה.</p><div id="status" role="status" aria-live="polite"></div><section id="setup" class="admin-box" hidden><h2>המסד טרם חובר</h2><p>הניהול יהיה זמין אחרי הגדרת פרויקט Supabase והרשאת המנהל.</p></section><form id="login" class="admin-box" hidden><h2>כניסת מנהל</h2><label>דוא״ל<input name="email" type="email" autocomplete="email" required></label><label>סיסמה<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">כניסה</button></form><section id="editor" hidden><div class="admin-toolbar"><input id="filter" type="search" placeholder="חיפוש שם בעברית או ברוסית"><button id="new-person" type="button">+ אדם חדש</button><button id="logout" type="button" class="secondary">יציאה</button></div><div class="admin-layout"><div id="person-list" class="admin-list"></div><form id="person-form" class="admin-box" hidden><h2 id="editor-title">עריכת פרופיל</h2><input name="id" type="hidden"><label>שם בעברית<input name="name_he" required></label><label>Имя по-русски<input name="name_ru" required></label><label class="check"><input name="deceased" type="checkbox"> לזכרו/ה</label><label>תמונה (JPG, PNG או WebP, עד 5 MB)<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="photo-preview" class="photo-preview" alt="תמונת פרופיל" hidden><div class="admin-actions"><button type="submit">שמירת פרופיל</button><button id="remove-photo" type="button" class="secondary">הסרת תמונה</button></div><p class="admin-note">קשרים משפחתיים נשמרים בנפרד. פרופיל חדש יופיע בחיפוש עד שיוגדרו לו קשרים.</p></form></div></section></main></body></html>
